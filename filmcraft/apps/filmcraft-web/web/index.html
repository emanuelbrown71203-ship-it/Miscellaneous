<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cutroom</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
    }
    #loading img { width: 56px; height: 56px; }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
    #fatal {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(20, 20, 22, 0.88); color: #e6e6e8; font: 14px/1.45 system-ui, sans-serif; z-index: 10;
    }
    #fatal.on { display: flex; }
    #fatal .box { max-width: min(78ch, calc(100vw - 32px)); padding: 20px 24px; background: #26272b; border-radius: 8px; }
    #fatal h1 { margin: 0 0 8px; font-size: 17px; color: #ff8a7a; }
    #fatal pre { max-height: 40vh; overflow: auto; white-space: pre-wrap; font-size: 12px; color: #c9c9cc; }
    #fatal button { font: inherit; padding: 6px 14px; border: 0; border-radius: 6px; background: #3b6fe0; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="filmcraft_canvas"></canvas>
  <div id="loading"><img src="favicon.png" alt=""><div id="status">Loading Cutroom…</div></div>
  <div id="fatal" role="alertdialog" aria-labelledby="fatal-title">
    <div class="box">
      <h1 id="fatal-title">Cutroom stopped working</h1>
      <div>Unsaved changes are kept in the browser every few seconds and come back when you reload.</div>
      <pre id="fatal-msg"></pre>
      <button id="fatal-reload" type="button">Reload</button>
    </div>
  </div>
  <script src="sentry.min.js"></script>
  <script>
    // Crash reports (Sentry): panics, fatal errors and failed start-ups only. No session replay,
    // tracing, IP address or console logs; file names in messages are replaced with <file>.
    // `?noreport` turns reporting off; `?sentrytest` sends one test event.
    const EXT = "mp4|m4v|mov|mkv|webm|avi|mxf|mts|m2ts|ts|wav|aif|aiff|mp3|aac|m4a|flac|ogg|opus|png|jpe?g|tiff?|exr|dpx|gif|webp|psd|srt|vtt|scc|fcproj|fcgt|xml|edl|otio|aaf|omf|cube";
    const QUOTED = /“[^”]*”|"[^"\n]*"|'[^'\n]*'/g;
    const ABS_PATH = /(?:[A-Za-z]:[\\/]|\\\\|\/(?:Users|home|Volumes|mnt|media|private|tmp|var|run)\/)[^:\n]*/g;
    const FILE_WORDS = new RegExp(`(?:[^\\s/\\\\<>|:]+ ){0,4}[^\\s/\\\\<>|:]+\\.(?:${EXT})\\b`, "gi");
    const scrub = (s) => (typeof s === "string" ? s.replace(QUOTED, "“<redacted>”").replace(ABS_PATH, "<path>").replace(FILE_WORDS, "<file>") : s);
    const reportParams = new URLSearchParams(location.search);
    const reporting = !!window.Sentry && !reportParams.has("noreport");
    if (reporting) {
      window.Sentry.init({
        dsn: "https://0da9c6eaecbeea29a64b61d56b7f81c9@o4512478439931904.ingest.us.sentry.io/4512478460379136",
        release: "cutroom@__FC_BUILD__",
        environment: location.hostname === "cutroom-six-mu.vercel.app" ? "production" : "development",
        // SDK 11 ignores `sendDefaultPii`; `dataCollection` decides, and its defaults collect user
        // info (the IP address), cookies, headers and URL query strings. Turn all of that off.
        dataCollection: {
          userInfo: false,
          cookies: false,
          httpHeaders: false,
          httpBodies: [],
          urlQueryParams: false,
          stackFrameVariables: false,
        },
        beforeBreadcrumb: (b) => (b.category === "console" ? null : b),
        beforeSend(event) {
          event.message = scrub(event.message);
          if (event.logentry) event.logentry.message = scrub(event.logentry.message);
          for (const ex of (event.exception && event.exception.values) || []) ex.value = scrub(ex.value);
          return event;
        },
      });
      if (reportParams.has("sentrytest")) window.Sentry.captureMessage("Cutroom test event", "info");
    }
    const reported = new Set();
    window.cutroomReport = (what, level) => {
      if (!reporting) return;
      const text = String(what && (what.stack || what.message) || what).slice(0, 4000);
      if (reported.has(text)) return;
      reported.add(text);
      if (what instanceof Error) {
        window.Sentry.captureException(what, { level });
      } else {
        // A Rust panic arrives as text. Send it as a named error grouped by its first line
        // ("panicked at crates/…/file.rs:line:col: …"); otherwise every panic shares this
        // function's stack and Sentry files them all as one issue titled after it.
        const err = new Error(text);
        err.name = /panicked at/.test(text) ? "Rust panic" : "Cutroom error";
        const key = text.replace(/^.*?(panicked at \S+).*$/s, "$1").split("\n")[0];
        window.Sentry.captureException(err, { level, fingerprint: [err.name, key] });
      }
    };
  </script>
  <script>
    // A Rust panic (or an out-of-memory abort) inside a frame stops the app for good: eframe logs
    // "panicked at …" with console.error, then the wasm traps ("RuntimeError: unreachable") and
    // the canvas freezes or goes blank. Show what happened instead of a dead page.
    window.filmcraftLoad = {};
    let lastPanic = null;
    const consoleError = console.error.bind(console);
    console.error = (...a) => {
      const m = a.map(String).join(" ");
      if (/panicked at|memory allocation of/.test(m)) {
        lastPanic = m;
        window.cutroomReport(m, "error");
      }
      consoleError(...a);
    };
    window.filmcraftFatal = (what) => {
      if (window.filmcraftLoad.fatal) return;
      const msg = lastPanic || String(what && (what.stack || what.message) || what);
      window.filmcraftLoad.fatal = msg;
      window.cutroomReport(msg, "fatal");
      const el = document.getElementById("fatal");
      document.getElementById("fatal-msg").textContent = msg.split("\n\nStack:")[0];
      el.classList.add("on");
    };
    document.getElementById("fatal-reload").onclick = () => location.reload();
    const isFatal = (e) => e instanceof WebAssembly.RuntimeError || /panicked at|unreachable|memory access out of bounds/.test(String(e && e.message || e));
    // only after start-up: a failed start is shown in #loading below
    addEventListener("error", (ev) => { if (window.filmcraftLoad.readyMs && isFatal(ev.error || ev.message)) window.filmcraftFatal(ev.error || ev.message); });
    addEventListener("unhandledrejection", (ev) => { if (window.filmcraftLoad.readyMs && isFatal(ev.reason)) window.filmcraftFatal(ev.reason); });
  </script>
  <script type="module">
    // `__FC_BUILD__` is replaced by `cargo xtask web` with a hash of the build: the glue and the
    // wasm are cached as immutable, so their URLs must change with every build.
    const build = "__FC_BUILD__";
    const v = build.startsWith("__") ? "" : "?v=" + build;
    const t0 = performance.now();
    const params = new URLSearchParams(location.search);
    try {
      const { default: init, start } = await import("./filmcraft_web.js" + v);
      await init({ module_or_path: new URL("filmcraft_web_bg.wasm" + v, location.href) });
      window.filmcraftLoad.wasmMs = performance.now() - t0;
      await start("filmcraft_canvas");
      window.filmcraftLoad.readyMs = performance.now() - t0;
    } catch (e) {
      const text = String(e && e.stack || e);
      window.filmcraftLoad.error = String(e);
      window.cutroomReport(e, "fatal");
      // WebGPU was found but could not be started: try again on WebGL2 (once)
      if (!params.has("webgl") && !params.has("cpu") && /wgpu|webgpu|requestDevice|requestAdapter|GPUDevice|surface/i.test(text)) {
        params.set("webgl", "");
        location.replace(location.pathname + "?" + params.toString().replace(/=(&|$)/g, "$1") + location.hash);
      } else {
        const s = document.getElementById("status");
        if (s) { s.className = "err"; s.textContent = "Cutroom failed to start:\n" + text; }
      }
      throw e;
    }
  </script>
</body>
</html>
